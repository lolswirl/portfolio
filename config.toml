# The URL the site will be built for
base_url = "https://im-swirl.vercel.app"

title = "swirl."
theme = "apollo"
taxonomies = [{ name = "tags" }]

compile_sass = true
minify_html = true
build_search_index = true

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown]
highlight_code = true

[extra]
theme = "toggle"
favicon = "/icons/favicon.svg"
fancy_code = true
dynamic_node = true
toc = true
use_cdn = true
repo_url = "https://github.com/lolswirl/site/"

socials = [
  { name = "github", url = "https://github.com/lolswirl/", icon = "github" },
  { name = "discord", url = "https://discord.com/users/188815794929401856", icon = "discord" },
  { name = "twitch", url = "https://www.twitch.tv/lolswirl", icon = "twitch" },  
  { name = "twitter", url = "https://twitter.com/seismically", icon = "twitter" },
  { name = "linkedin", url = "https://www.linkedin.com/in/ronald-shevchenko/", icon = "linkedin" }, 
]

menu = [
  { name = "/posts", url = "/posts", weight = 1 },
  { name = "/projects", url = "/projects", weight = 2 },
  { name = "/about", url = "/about", weight = 3 },
  { name = "/tags", url = "/tags", weight = 4 },
]
