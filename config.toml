base_url = "https://rshevchenko.com"

title = "shevchenko."
description = "ronald shevchenko. software engineer in nyc. c++ and python, trading systems at macquarie, side projects in typescript and lua."
taxonomies = [{ name = "tags" }]

minify_html = true

[markdown.highlighting]
style = "class"
# banner (rainglow) from vs code with my editor token customizations; the light
# theme is the same colors darkened to stay readable on the light background
extra_themes = ["syntax/banner-swirl.json", "syntax/banner-swirl-light.json"]
light_theme = "banner-swirl-light"
dark_theme = "banner-swirl"

[extra]
favicon = "/icons/favicon.svg"
# browser tab and link preview title on the homepage (other pages use "page | title")
home_title = "ronald shevchenko."
# heading style for ## and ###: a (~/exp, ~/../xyz), b (:: exp, ::: xyz), c ([exp], [[xyz]]),
# d (exp ───, xyz ┄┄┄), e (exp., xyz..), f (𖦹 exp, 𖦹𖦹 xyz), no entry ie "" defaults (## exp, ### xyz)
delimiter = "b"
# earlier role under a promotion: a (plain indent), b (↳ arrow), c (accent rule line), d ("promoted from ..."), e (· dot), f ("prev ...")
earlier_role = "f"
# project row marker: a (→), b (▸), c (»), d (›), e (⇢, from a fallback font so slightly wider), f (↳), g (⇒), h (➜), i (0, 1, 2...), no entry ie "" defaults (>)
row_marker = "i"
# homepage "listening" line from spotify, served by functions/api/now-playing.js on cloudflare pages
now_playing = true

socials = [
